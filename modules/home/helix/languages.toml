[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

# md
[language-server.markdown-oxide]
command = "markdown-oxide"
display-inlay-hints = true

[[language]]
name = "markdown"
scope = "source.md"
language-servers = [ "harper-ls", "markdown-oxide"]

# typst
[language-server.tinymist]
command = "tinymist"
config = { formatterMode = "typstyle", preview.background.enabled = true, preview.background.args = ["--data-plane-host=127.0.0.1:23635", "--invert-colors=never",  "--open"] }

#, "--invert-colors=never" 
 
[[language]]
name = "typst"
scope = "source.typ"
language-servers = ["harper-ls", "tinymist"]
auto-format = true
formatter = { command = "typstyle"}



